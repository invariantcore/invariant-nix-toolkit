version: '3'

vars:
  HOSTNAME:
    sh: hostname -s
  USER:
    sh: id -un

tasks:
  default:
    desc: "Show available tasks and usage guide"
    cmds:
      - task --list

  nx:switch:
    aliases: [nix:switch]
    desc: "Apply declarative user configuration (home-manager)"
    cmds:
      - home-manager switch --flake .#{{.USER}}@{{.HOSTNAME}}

  nx:update:
    aliases: [nix:update]
    desc: "Update ALL flake dependencies and rebuild system"
    cmds:
      - nix flake update
      - task: nx:switch

  nx:update:toolkit:
    aliases: [nix:update:toolkit]
    desc: "Update only Invariant Core toolkit (fast) and rebuild system"
    cmds:
      - nix flake update invariant
      - task: nx:switch

  nx:check:
    aliases: [nix:check]
    desc: "Validate and evaluate flake outputs without activating"
    cmds:
      - nix flake check

  nx:gc:
    aliases: [nix:gc]
    desc: "Garbage collect old generations and optimize Nix store"
    cmds:
      - nix-collect-garbage -d
      - nix store optimise
